<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120720">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hitster Live</title>
<style>
:root{--bg:#120720;--card:#221036;--acc:#ff3d8b;--acc2:#ffd23f;--tx:#f7f0ff;--mut:#a794bd;--g:#38d27a;--p:#ff7ab8;--y:#ffd23f;--v:#9b5de5;--b:#3fa0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 30% 10%,#2a0f45,var(--bg) 60%) fixed;color:var(--tx);min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);user-select:none;-webkit-user-select:none;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;border-radius:1rem;padding:.8rem 1rem;background:#2a1745;font-weight:800;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
button.pri{background:linear-gradient(135deg,#ff3d8b,#ff7a45);color:#fff;box-shadow:0 .4rem 1.2rem #ff3d8b55}
button:disabled{opacity:.4}
input{font:inherit;font-size:1.15rem;color:var(--tx);background:#150a28;border:.15rem solid #4a2a78;border-radius:1rem;padding:.8rem 1rem;width:100%;outline:none;user-select:text;-webkit-user-select:text}
input:focus{border-color:var(--acc)}
.screen{display:none;min-height:100dvh;padding:1.2rem}
.screen.on{display:flex;flex-direction:column}
#join{justify-content:center;gap:1rem;text-align:center}
#join h1{margin:0;font-size:2.2rem;letter-spacing:.03em}#join h1 b{color:var(--acc)}
#join p{color:var(--mut);margin:0}
/* game */
#game{gap:.7rem;padding:.8rem .9rem 1.2rem}
header{display:flex;align-items:center;gap:.6rem}
#av{font-size:1.9rem}
#name{font-size:1.2rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#okc{font-weight:900;color:var(--acc2);background:#ffffff14;border-radius:2rem;padding:.2rem .7rem}
#dot{width:.8rem;height:.8rem;border-radius:50%;background:#f55;box-shadow:0 0 .6rem currentColor;color:#f55}
#dot.on{background:var(--g);color:var(--g)}
#banner{border-radius:1.2rem;padding:.8rem 1rem;text-align:center;background:linear-gradient(145deg,#ffffff14,#ffffff06);border:.12rem solid #ffffff22;min-height:4.6rem;display:flex;flex-direction:column;justify-content:center;gap:.15rem;transition:background .3s}
#banner .t{font-size:1.25rem;font-weight:900;line-height:1.15}
#banner .s{font-size:.95rem;color:#e6d8f5}
#banner.good{background:linear-gradient(145deg,#1f8f4f,#146b38);border-color:#6df0a2}
#banner.bad{background:linear-gradient(145deg,#8f2b3a,#5e1a28);border-color:#ff8a8a}
#banner.win{background:linear-gradient(90deg,#ffd23f,#ff7ab8,#3fa0ff);color:#150a28;animation:wing 2s linear infinite;background-size:300% 100%}
#banner.win .s{color:#150a28}
@keyframes wing{to{background-position:300% 0}}
#banner.cat-title{background:var(--g);color:#06301a}#banner.cat-year{background:var(--p);color:#40052a}#banner.cat-artist{background:var(--y);color:#3a2c00}#banner.cat-decade{background:var(--v);color:#fff}#banner.cat-near{background:var(--b);color:#031c3a}
#banner[class*="cat-"] .s{color:inherit;opacity:.85}
#banner.turn{background:linear-gradient(135deg,#ff3d8b,#9b5de5);animation:tp 1.2s ease-in-out infinite alternate}
@keyframes tp{to{box-shadow:0 0 1.6rem #ff3d8b99}}
/* rad */
#spinbox{display:none;flex-direction:column;gap:.4rem;align-items:center}
#spinbox.on{display:flex}
#pwrap{position:relative;width:min(80vw,42dvh);aspect-ratio:1;margin:1.3rem auto .2rem;touch-action:none;border-radius:50%;transition:box-shadow .3s,opacity .3s;opacity:.75}
#pwrap.mine{opacity:1;cursor:grab;box-shadow:0 0 0 .25rem #ffffff22,0 0 2.2rem #ff3d8b99;animation:wglow 1.4s ease-in-out infinite alternate}
@keyframes wglow{to{box-shadow:0 0 0 .25rem #ffffff55,0 0 3.4rem #ff3d8bcc}}
#pw{display:block;width:100%;height:100%;border-radius:50%;will-change:transform;pointer-events:none}
#ppoint{position:absolute;top:-1.1rem;left:50%;transform:translateX(-50%);width:0;height:0;border-left:.95rem solid transparent;border-right:.95rem solid transparent;border-top:1.7rem solid var(--acc2);filter:drop-shadow(0 .15rem .2rem #0008);z-index:2}
#phub{position:absolute;inset:36%;border-radius:50%;background:radial-gradient(circle at 30% 25%,#3d2468,#150a28 70%);border:.12rem solid #fff6;display:grid;place-items:center;font-weight:900;font-size:min(3.4vw,1.4dvh + .55rem);text-align:center;line-height:1.05;pointer-events:none;z-index:1}
#swipe{position:absolute;inset:0;display:none;place-items:center;pointer-events:none;z-index:3;font-size:3.4rem;animation:swp 1.4s ease-in-out infinite}
#swipeLbl{position:absolute;left:50%;bottom:-.2rem;transform:translateX(-50%);background:#fff;color:#c01a63;font-weight:900;font-size:1.15rem;letter-spacing:.06em;padding:.45rem 1.2rem;border-radius:2rem;box-shadow:0 .4rem 1.4rem #0009;z-index:4;display:none;white-space:nowrap;animation:lblp .9s ease-in-out infinite alternate}
#pwrap.mine #swipeLbl{display:block}#pwrap.touched #swipeLbl{display:none}
@keyframes lblp{to{transform:translateX(-50%) scale(1.08)}}
#pwrap.mine::before{content:'';position:absolute;inset:-.9rem;border-radius:50%;border:.3rem solid #ff3d8b;opacity:0;animation:ringp 1.4s ease-out infinite;pointer-events:none}
@keyframes ringp{0%{opacity:.9;transform:scale(.96)}100%{opacity:0;transform:scale(1.12)}}
body.myturn #spinHint{color:#fff;font-size:1.15rem;font-weight:900}
#pwrap.mine #swipe{display:grid}
#pwrap.touched #swipe{display:none}
@keyframes swp{0%,100%{transform:translateX(-1.6rem) rotate(-12deg);opacity:.9}50%{transform:translateX(1.6rem) rotate(12deg);opacity:.35}}
#spinHint{text-align:center;color:#e6d8f5;font-size:.95rem;font-weight:700;min-height:1.3rem;padding:0 .5rem}
body.wheelon #cardwrap{width:min(100%,36dvh)}
body.wheelon .c{font-size:1rem}
/* kaart */
#cardwrap{width:min(100%,56dvh);margin:0 auto}
#card{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem;aspect-ratio:1;width:100%}
.c{border-radius:.7rem;position:relative;transition:transform .2s,opacity .25s,filter .25s;display:grid;place-items:center;font-size:1.6rem;font-weight:900;color:#fff}
.t-title{background:linear-gradient(145deg,#4ee08c,#25b563)}.t-year{background:linear-gradient(145deg,#ff9ac9,#f0629f)}.t-artist{background:linear-gradient(145deg,#ffe066,#f5bf17)}.t-decade{background:linear-gradient(145deg,#b585f2,#8447d6)}.t-near{background:linear-gradient(145deg,#6bb8ff,#2f86e6)}
.c.dim{opacity:.22;filter:saturate(.5)}
.c.hl{animation:hl 1s ease-in-out infinite alternate;z-index:1}
@keyframes hl{to{transform:scale(1.07);box-shadow:0 0 1rem #fff9}}
.c.pk{background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.45) 0 .55rem,transparent .55rem 1.1rem);outline:.2rem solid #fff;transform:scale(1.06);z-index:2}
.c.ok::after{content:'✓';text-shadow:0 .1rem .3rem #0007;font-size:1.9rem}
.c.ok{box-shadow:inset 0 0 0 .2rem #fffc}
.c.pop{animation:pop .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.25)}}
.c.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-.25rem)}75%{transform:translateX(.25rem)}}
/* antwoord */
#sheet{display:none;flex-direction:column;gap:.6rem;background:#ffffff0d;border:.12rem solid #ffffff22;border-radius:1.2rem;padding:.8rem}
#sheet.on{display:flex}
#sheet label{font-weight:800;font-size:.95rem;color:#e6d8f5}
#decs{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
#decs button{padding:.8rem 0;font-size:1.05rem;background:#2a1745;border:.15rem solid transparent}
#decs button.on{background:var(--v);border-color:#fff}
#sent{text-align:center;font-weight:800;color:#6df0a2}
#sent em{display:block;color:#fff;font-style:normal;font-size:1.25rem;margin:.2rem 0 .5rem}
#toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(200%);background:#000c;border:.1rem solid #ffffff30;border-radius:2rem;padding:.55rem 1.1rem;font-weight:800;max-width:90vw;text-align:center;transition:transform .3s;z-index:20;pointer-events:none}
#toast.on{transform:translateX(-50%) translateY(0)}
#legend{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center;font-size:.72rem;color:#000;font-weight:800;margin-top:.2rem}
#legend span{border-radius:2rem;padding:.15rem .55rem}
</style>
</head>
<body>

<div class="screen" id="join">
 <h1>MUZIEK<b>BINGO</b></h1>
 <p>Hoe heet je?</p>
 <input id="nm" maxlength="16" placeholder="Je naam" autocomplete="off" autocapitalize="words">
 <input id="rc" maxlength="4" placeholder="ROOMCODE" autocomplete="off" autocapitalize="characters" spellcheck="false" style="text-align:center;letter-spacing:.35em;font-weight:900;text-transform:uppercase">
 <p style="font-size:.85rem">De roomcode staat op de tv, naast de QR-code.</p>
 <button class="pri" id="go">Meedoen</button>
 <p id="joinmsg"></p>
</div>

<div class="screen" id="game">
 <header><span id="av">🎵</span><b id="name"></b><span id="okc">✓0</span><span id="dot"></span></header>
 <div id="banner"></div>
 <div id="spinbox">
  <div id="pwrap"><div id="ppoint"></div><canvas id="pw" width="720" height="720"></canvas><div id="phub">🎵</div><div id="swipe">👆</div><div id="swipeLbl">SWIPE OM TE DRAAIEN</div></div>
  <div id="spinHint"></div>
 </div>
 <div id="cardwrap"><div id="card"></div></div>
 <div id="sheet"></div>
 <div id="legend">
  <span style="background:var(--g)">Titel</span><span style="background:var(--p)">Jaartal</span><span style="background:var(--y)">Artiest</span><span style="background:var(--v);color:#fff">Decennium</span><span style="background:var(--b)">± 3 jaar</span>
 </div>
</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const LS={get:(k,d)=>{try{return localStorage.getItem(k)??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CAT={title:{c:'Groen',t:'titel van het liedje',cls:'t-title'},year:{c:'Roze',t:'het exacte jaartal',cls:'t-year'},artist:{c:'Geel',t:'de artiest of groep',cls:'t-artist'},decade:{c:'Paars',t:'het decennium',cls:'t-decade'},near:{c:'Blauw',t:'het jaar (± 3 jaar goed)',cls:'t-near'}};
const DECS=['50s','60s','70s','80s','90s','00s','10s','20s'];
const DECL=d=>({'00s':'2000','10s':'2010','20s':'2020'}[d]||('19'+d.slice(0,2)));

let myId=LS.get('hl_id',null);if(!myId){myId=(crypto.randomUUID?crypto.randomUUID():'p'+Math.random().toString(36).slice(2)+Date.now().toString(36));LS.set('hl_id',myId)}
let myName=LS.get('hl_name','');
let myCode=((new URLSearchParams(location.search).get('c'))||LS.get('hl_code','')||'').toUpperCase().slice(0,4);
let S=null;            // laatste status van de tv
let ws=null,wsOk=false,tvOn=true,stop=false,retry=0,draft='',lastPop=-1;

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function toast(m,ms=2200){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),ms)}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch{}};

/* ---------- verbinding ---------- */
function connect(){
 if(stop)return;
 ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws?role=player`);
 ws.onopen=()=>{wsOk=true;retry=0;ws.send(JSON.stringify({t:'hello',id:myId,name:myName,code:myCode}));draw()};
 ws.onclose=()=>{wsOk=false;draw();if(!stop)setTimeout(connect,Math.min(5000,500+retry++*700))};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}on(m)};
}
const send=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(!ws||ws.readyState>1)connect();else send({k:'sync'});wake()}});
let wl=null;async function wake(){try{if(navigator.wakeLock&&!document.hidden)wl=await navigator.wakeLock.request('screen')}catch{}}

function on(m){
 if(m.t==='welcome'){tvOn=m.tv;draw();return}
 if(m.t==='tv'){tvOn=m.on;if(m.on)send({k:'sync'});draw();return}
 if(m.t==='badcode'){stop=true;S=null;show('join');$('#rc').value='';$('#joinmsg').textContent=m.locked?'Te veel pogingen. Probeer het over een paar minuten opnieuw.':'Onjuiste roomcode. Kijk op de tv.';return}
 if(m.t==='full'){stop=true;show('join');$('#joinmsg').textContent='Het spel zit vol (max 25 spelers).';return}
 if(m.t==='kicked'){stop=true;S=null;show('join');$('#joinmsg').textContent=m.why==='elders'?'Je bent op een ander apparaat ingelogd.':'Je bent uit het spel verwijderd.';return}
 if(m.t!=='msg')return;
 const d=m.data||{};
 switch(d.k){
  case 'state':S=d;draft='';sentSpin=false;if(d.round&&d.round.cat)wheelSet(d.round.cat);break;
  case 'phase':if(S)S.phase=d.phase;break;
  case 'turn':if(S)S.turn={who:d.who,name:d.name,ready:d.ready};sentSpin=false;break;
  case 'anim':wheelAnim(d);break;
  case 'spin':if(S){S.round={s:'spin'};S.turn={...(S.turn||{}),ready:false,spinner:d.by,spinnerName:d.name}}draft='';sentSpin=false;buzz(30);wheelKick();break;
  case 'round':if(S){S.round={s:'open',cat:d.cat,ask:d.ask,color:d.color,pick:null,sub:false,inRound:true};S.n=d.n}draft='';sentSpin=false;buzz([60,40,60]);wheelLand(d.cat);break;
  case 'picked':if(S&&S.round){S.round.pick=d.i}break;
  case 'nopick':toast('Dat vakje kan nu niet');break;
  case 'answered':if(S&&S.round){S.round.sub=true;S.round.ans=d.v}buzz(40);break;
  case 'editing':if(S&&S.round)S.round.sub=false;break;
  case 'result':if(S){if(d.won&&!S.won)bingoConfetti();S.round={...S.round,s:'revealed',res:d.res};const old=S.card;S.card=d.card;S.won=d.won;if(d.res&&d.res.ok){buzz([80,40,80,40,200]);lastPop=S.round.pick}else buzz(200)}break;
 }
 draw();
}

/* ---------- tekenen ---------- */
const mine=()=>S&&S.turn&&S.turn.who===myId;
function banner(){
 const b=$('#banner');let cls='',t='',s='';
 if(!wsOk){t='Verbinding maken…';s='Zorg dat je op hetzelfde wifi zit als de tv.';if(S&&S.round&&S.round.s==='open'&&S.round.pick!=null&&!S.round.sub){cls='bad';t='⚠️ Verbinding weg';s='Je gekozen vakje blijft staan. Even wachten, we verbinden opnieuw…'}}
 else if(!tvOn){t='De tv is niet verbonden';s='Wachten op het tv-scherm…'}
 else if(!S){t='Even laden…'}
 else{
  const r=S.round||{s:'idle'};
  if(S.phase==='lobby'){t='Wachten tot het spel start…';s='Dit is jouw bingokaart.'}
  else if(r.s==='spin'){t='Het rad draait… 🎡';s=S.turn&&S.turn.spinnerName?S.turn.spinnerName+' draait':''}
  else if(r.s==='open'){
   const c=CAT[r.cat];cls='cat-'+r.cat;
   if(!r.inRound){t='Je doet mee vanaf de volgende ronde';cls=''}
   else if(r.sub){t=`${c.c}: antwoord verstuurd ✓`;s='Wachten op de onthulling…'}
   else if(r.pick==null){t=`${c.c}: noem ${c.t}`;s=`Tik een ${c.c.toLowerCase()} vakje op je kaart`}
   else{t=`${c.c}: noem ${c.t}`;s='Vul je antwoord hieronder in'}
  }else if(r.s==='revealed'){
   const x=r.res;
   if(!x){t='Het nummer is onthuld';s=mine()&&S.turn.ready?'':'Wachten op de volgende ronde'}
   else if(x.ok){cls='good';t='Goed! ✓';s='Het was: '+x.truth}
   else if(x.none){cls='bad';t='Geen antwoord';s='Het was: '+x.truth}
   else{cls='bad';t='Helaas ✗';s=`Het was: ${x.truth}`}
  }else{
   if(mine()&&S.turn.ready){cls='turn';t='🎡 JIJ MAG DRAAIEN!';s='Swipe over het rad hieronder'}
   else{t=S.turn&&S.turn.name?`🎡 ${S.turn.name} is aan de beurt`:'Wachten op de volgende ronde…'}
  }
  if(S.won){cls='win';t='🎉 BINGO! 🎉';s=t==='🎉 BINGO! 🎉'&&r.res?'Het was: '+r.res.truth:'Je hebt een rij vol!'}
  else if(r.s==='revealed'&&mine()&&S.turn.ready&&r.res){s+=(s?' · ':'')+'Jij mag draaien!'}
 }
 b.className=cls;b.innerHTML=`<div class="t">${esc(t)}</div>${s?`<div class="s">${esc(s)}</div>`:''}`;
}
function drawCard(){
 const c=$('#card');if(!S){c.innerHTML='';return}
 const r=S.round||{},open=r.s==='open'&&r.inRound;
 if(c.children.length!==25){c.innerHTML=Array.from({length:25},(_,i)=>`<div class="c" data-i="${i}"></div>`).join('')}
 S.card.forEach((x,i)=>{
  const el=c.children[i];
  let cls='c '+CAT[x.t].cls;
  if(x.ok)cls+=' ok';
  if(open&&!x.ok){if(x.t===r.cat){cls+=r.pick===i?' pk':(r.sub?'':' hl');if(r.sub&&r.pick!==i)cls+=' dim'}else cls+=' dim'}
  if(open&&r.pick===i&&r.sub)cls+=' pk';
  if(lastPop===i&&x.ok&&r.s==='revealed')cls+=' pop';
  if(el.className!==cls)el.className=cls;
 });
 lastPop=-1;
 $('#okc').textContent='✓'+S.card.filter(x=>x.ok).length;
}
function drawSheet(){
 const sh=$('#sheet'),r=S&&S.round;
 const need=S&&r&&r.s==='open'&&r.inRound&&r.pick!=null;
 if(!need){sh.className='';sh.innerHTML='';sh.dataset.key='';return}
 const key=r.cat+'|'+r.pick+'|'+(r.sub?'s':'e');
 if(sh.dataset.key===key)return;       // niet opnieuw opbouwen (toetsenbord blijft open)
 sh.dataset.key=key;sh.className='on';
 if(r.sub){
  sh.innerHTML=`<div id="sent">Verstuurd:<em>${esc(r.cat==='decade'?"jaren '"+r.ans.slice(0,2):r.ans)}</em><button id="edit">Wijzigen</button></div>`;
  $('#edit').onclick=()=>send({k:'edit'});return;
 }
 const cat=r.cat;
 if(cat==='decade'){
  sh.innerHTML=`<label>Welk decennium?</label><div id="decs">${DECS.map(d=>`<button data-d="${d}" class="${draft===d?'on':''}">${DECL(d)}</button>`).join('')}</div><button class="pri" id="snd" ${draft?'':'disabled'}>Versturen</button>`;
  $('#decs').onclick=e=>{const b=e.target.closest('button');if(!b)return;draft=b.dataset.d;document.querySelectorAll('#decs button').forEach(x=>x.classList.toggle('on',x===b));$('#snd').disabled=false;send({k:'typing'})};
  $('#snd').onclick=()=>draft&&send({k:'answer',v:draft});
  return;
 }
 const num=cat==='year'||cat==='near';
 sh.innerHTML=`<label>${num?'Welk jaar?':cat==='title'?'Titel van het nummer':'Artiest of groep'}</label><input id="ans" ${num?'inputmode="numeric" pattern="[0-9]*" maxlength="4"':'autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="50"'} placeholder="${num?'bijv. 1985':'Typ je antwoord'}" value="${esc(draft)}"><button class="pri" id="snd">Versturen</button>`;
 const inp=$('#ans'),snd=$('#snd');
 const ok=()=>num?/^\d{4}$/.test(inp.value.trim()):inp.value.trim().length>0;
 snd.disabled=!ok();
 let lt=0;
 inp.oninput=()=>{if(num)inp.value=inp.value.replace(/\D/g,'').slice(0,4);draft=inp.value;snd.disabled=!ok();const n=Date.now();if(n-lt>1000){lt=n;send({k:'typing'})}};
 const go=()=>{if(ok()){inp.blur();send({k:'answer',v:inp.value.trim()})}};
 snd.onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};
}
function canSpin(){return !!(S&&wsOk&&tvOn&&S.phase==='play'&&mine()&&S.turn.ready&&!sentSpin)}
function drawSpin(){
 const box=$('#spinbox'),r=S&&S.round||{};
 const show=!!(S&&S.phase==='play'&&!(r.s==='open'&&r.inRound));
 box.classList.toggle('on',show);document.body.classList.toggle('wheelon',show);
 const can=canSpin();$('#pwrap').classList.toggle('mine',can);document.body.classList.toggle('myturn',can);
 if(can&&!wasCan){buzz([120,70,120,70,200]);pwrap.classList.remove('touched')}wasCan=can;
 const spinning=r.s==='spin'||sentSpin;
 $('#spinHint').textContent=can?'👆 Swipe over het rad om te draaien. Hoe harder, hoe harder het draait!':spinning?'Het rad draait…':(S&&S.turn&&S.turn.name?`${S.turn.name} is aan de beurt`:'');
 $('#phub').textContent=r.cat&&r.s!=='spin'?WS[WI[r.cat]].l:'🎵';
}
function draw(){
 $('#dot').className=wsOk&&tvOn?'on':'';
 if(S){$('#av').textContent=S.av;$('#name').textContent=S.name;myName=S.name}
 banner();drawCard();drawSheet();drawSpin();
}

/* ---------- kaart aantikken ---------- */
$('#card').addEventListener('click',e=>{
 const el=e.target.closest('.c');if(!el||!S)return;
 const i=+el.dataset.i,r=S.round||{},x=S.card[i];
 if(r.s!=='open'||!r.inRound){toast(S.phase==='lobby'?'Het spel is nog niet gestart':'Wacht op de volgende ronde');return}
 if(r.sub){toast('Je antwoord is al verstuurd (tik op Wijzigen)');return}
 if(x.ok||x.t!==r.cat){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');toast(x.ok?'Dat vakje heb je al':`Kies een ${CAT[r.cat].c.toLowerCase()} vakje`);return}
 if(r.pick!==i){draft='';r.pick=i;draw();send({k:'pick',i})}
});

/* ---------- rad: swipe om te draaien ---------- */
const WS=[{t:'title',c:'#38d27a',l:'Titel'},{t:'year',c:'#ff7ab8',l:'Jaar'},{t:'artist',c:'#ffd23f',l:'Artiest'},{t:'decade',c:'#9b5de5',l:'Decennium'},{t:'near',c:'#3fa0ff',l:'± 3 jaar'}];
const WI=Object.fromEntries(WS.map((x,i)=>[x.t,i]));
let sentSpin=false,wasCan=false,animSeen=false;
let rot=0,vel=0,drag=false,easing=null,raf=0,lastT=0,lastSeg=-1;
const pw=$('#pw'),pwrap=$('#pwrap');
(function paint(){
 const c=pw.getContext('2d'),R=pw.width/2,n=WS.length,sg=2*Math.PI/n;
 c.translate(R,R);
 WS.forEach((w,i)=>{
  const a0=-Math.PI/2+i*sg,a1=a0+sg;
  const g=c.createRadialGradient(0,0,R*.15,0,0,R);g.addColorStop(0,w.c);g.addColorStop(1,w.c+'cc');
  c.beginPath();c.moveTo(0,0);c.arc(0,0,R-6,a0,a1);c.closePath();c.fillStyle=g;c.fill();
  c.lineWidth=5;c.strokeStyle='#ffffff55';c.stroke();
  c.save();c.rotate(a0+sg/2);c.textAlign='right';c.textBaseline='middle';c.fillStyle=i===2?'#3a2c00':'#fff';
  let fs=54;c.font=`900 ${fs}px system-ui,-apple-system,sans-serif`;while(c.measureText(w.l).width>205&&fs>26){fs-=2;c.font=`900 ${fs}px system-ui,-apple-system,sans-serif`}
  c.shadowColor='#0005';c.shadowBlur=6;c.fillText(w.l,R-48,0);c.restore();
 });
 c.beginPath();c.arc(0,0,R-3,0,7);c.lineWidth=6;c.strokeStyle='#ffffff66';c.stroke();
})();
const norm=a=>((a%360)+360)%360;
const wrap=a=>((a+540)%360)-180;
function paintRot(){pw.style.transform=`rotate(${rot}deg)`}
function kick(){if(!raf){lastT=performance.now();raf=requestAnimationFrame(loop)}}
function loop(t){
 raf=0;const dt=Math.min(.05,Math.max(.001,(t-lastT)/1000));lastT=t;
 if(easing){
  const k=Math.min(1,(t-easing.t0)/easing.dur),e=easing.tv?tvEase(k):1-Math.pow(1-k,3);
  rot=easing.from+(easing.to-easing.from)*e;if(k>=1){easing=null;vel=0}
 }else if(!drag){
  const spinning=S&&S.round&&S.round.s==='spin';
  rot+=vel*dt;vel*=Math.pow(.33,dt);
  if(spinning&&!animSeen&&Math.abs(vel)<160)vel=160*(vel<0?-1:1);
  if(!spinning&&Math.abs(vel)<4)vel=0;
 }
 const seg=Math.floor(norm(-rot)/72);
 if(seg!==lastSeg){if(lastSeg!==-1&&(Math.abs(vel)>120||drag))buzz(5);lastSeg=seg}
 paintRot();
 if(vel||drag||easing||(S&&S.round&&S.round.s==='spin'))kick();
}
const bez=(x1,y1,x2,y2)=>t=>{if(t<=0)return 0;if(t>=1)return 1;let lo=0,hi=1,u=t;for(let i=0;i<28;i++){const x=3*(1-u)*(1-u)*u*x1+3*(1-u)*u*u*x2+u*u*u;if(x<t)lo=u;else hi=u;u=(lo+hi)/2}return 3*(1-u)*(1-u)*u*y1+3*(1-u)*u*u*y2+u*u*u};
const tvEase=bez(.12,.7,.1,1);
function wheelAnim(d){
 if(typeof d.extra!=='number')return;
 drag=false;animSeen=true;const dir=d.extra<0?-1:1,turns=Math.floor(Math.abs(d.extra)/360);
 const frac=dir>0?norm(d.fin-rot):norm(rot-d.fin);
 easing={from:rot,to:rot+dir*(360*turns+frac),t0:performance.now(),dur:d.dur*1000,tv:true};vel=0;kick();
}
function wheelKick(){animSeen=false;if(Math.abs(vel)<600)vel=(vel<0?-1:1)*700;kick()}
function wheelLand(cat){
 const i=WI[cat];if(i==null)return;
 if(easing&&easing.tv)return;
 if(Math.floor(norm(-rot)/72)===i&&!easing)return;
 const T=-(i+.5)*72+(Math.random()-.5)*40,dir=vel<0?-1:1;
 let d=dir>0?norm(T-rot):-norm(rot-T);
 if(Math.abs(d)<60)d+=dir*360;
 easing={from:rot,to:rot+d,t0:performance.now(),dur:1100};vel=0;kick();
}
function wheelSet(cat){const i=WI[cat];if(i==null)return;rot=-(i+.5)*72;vel=0;easing=null;paintRot()}
(function(){
 let a0=0,samples=[];
 const ang=e=>{const r=pwrap.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI};
 pwrap.addEventListener('pointerdown',e=>{
  if(!canSpin()||easing)return;e.preventDefault();
  drag=true;vel=0;a0=ang(e);samples=[[performance.now(),rot]];pwrap.classList.add('touched');
  try{pwrap.setPointerCapture(e.pointerId)}catch{};kick();
 });
 pwrap.addEventListener('pointermove',e=>{
  if(!drag)return;e.preventDefault();
  const a=ang(e);rot+=wrap(a-a0);a0=a;
  const n=performance.now();samples.push([n,rot]);while(samples.length>2&&n-samples[0][0]>110)samples.shift();
 });
 const end=e=>{
  if(!drag)return;drag=false;
  const n=performance.now(),f=samples[0],l=samples[samples.length-1];
  let v=0;if(l&&f&&n-l[0]<90&&l[0]>f[0])v=(l[1]-f[1])/((l[0]-f[0])/1000);
  if(Math.abs(v)<220){vel=v*.3;toast('Swipe wat harder 👆',1400);kick();return}
  v=Math.max(-4500,Math.min(4500,v));vel=v;sentSpin=true;buzz(40);
  send({k:'spin',force:Math.min(2.4,.15+Math.abs(v)/800),dir:v<0?-1:1});
  drawSpin();kick();
 };
 pwrap.addEventListener('pointerup',end);pwrap.addEventListener('pointercancel',end);
 pwrap.addEventListener('contextmenu',e=>e.preventDefault());
})();
/* ---------- start ---------- */
function start(){
 myName=($('#nm').value||'').trim().slice(0,16);myCode=($('#rc').value||'').trim().toUpperCase();
 if(!myName){$('#nm').focus();return}
 if(myCode.length!==4){$('#rc').focus();$('#joinmsg').textContent='Vul de roomcode van 4 letters in.';return}
 $('#joinmsg').textContent='';LS.set('hl_name',myName);LS.set('hl_code',myCode);stop=false;show('game');wake();draw();connect();
}
$('#go').onclick=start;$('#nm').onkeydown=e=>{if(e.key==='Enter')$('#rc').focus()};$('#rc').onkeydown=e=>{if(e.key==='Enter')start()};$('#rc').oninput=e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z]/g,'')};
$('#nm').value=myName;$('#rc').value=myCode;
if(myName&&myCode.length===4){show('game');wake();draw();connect()}else show('join');

/* ---------- confetti bij bingo ---------- */
const cf=document.createElement('canvas');cf.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90';document.body.appendChild(cf);
let cparts=[],cOn=false;
function bingoConfetti(){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 cf.width=innerWidth*devicePixelRatio;cf.height=innerHeight*devicePixelRatio;
 const cols=['#ff3d8b','#ffd23f','#38d27a','#3fa0ff','#9b5de5','#fff'];
 const burst=(x,n)=>{for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*1.8,sp=(9+Math.random()*13)*devicePixelRatio;cparts.push({x:x*devicePixelRatio,y:innerHeight*.75*devicePixelRatio,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:(6+Math.random()*8)*devicePixelRatio,c:cols[i%6],rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:1})}};
 [0,350,700,1100,1600].forEach((d,i)=>setTimeout(()=>{burst(innerWidth*.2,60);burst(innerWidth*.8,60);burst(innerWidth*.5,70)},d));
 buzz([100,50,100,50,100,50,400]);
 if(!cOn){cOn=true;requestAnimationFrame(cTick)}
}
function cTick(){
 const c=cf.getContext('2d');c.clearRect(0,0,cf.width,cf.height);
 cparts=cparts.filter(q=>q.life>0&&q.y<cf.height+40);
 for(const q of cparts){q.vy+=.45*devicePixelRatio;q.vx*=.99;q.x+=q.vx;q.y+=q.vy;q.rot+=q.vr;q.life-=.007;c.save();c.globalAlpha=Math.max(0,Math.min(1,q.life*1.8));c.translate(q.x,q.y);c.rotate(q.rot);c.fillStyle=q.c;c.fillRect(-q.r/2,-q.r/3,q.r,q.r*.6);c.restore()}
 if(cparts.length)requestAnimationFrame(cTick);else{cOn=false}
}
</script>
